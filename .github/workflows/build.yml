name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C test/host run

  arduino-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          # 'specification' lets a not-yet-published template pass; switch to
          # 'strict' once you've renamed the library and submitted it to the
          # Library Manager registry.
          compliance: specification
          library-manager: false

  compile-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:avr:mega
          - arduino:samd:mkrwifi1010
          - esp32:esp32:esp32
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for compile-sketches to optionally compute size
          # deltas against the parent commit. Set to 1 if you don't care.
          fetch-depth: 0
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/Basic
            - examples/Advanced
          # Disabled: relies on a parent commit which doesn't exist on the
          # initial commit. Re-enable on PRs only if you want size deltas.
          enable-deltas-report: false
          platforms: |
            - name: arduino:avr
            - name: arduino:samd
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
